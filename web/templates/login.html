<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Scanner de Red</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1d23; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #22252b; border: 1px solid #333; border-radius: 12px; padding: 2.5rem; max-width: 400px; width: 100%; }
        .login-card h2 { color: #00D4AA; }
        .btn-login { background: #00D4AA; border: none; color: #1a1d23; font-weight: 600; }
        .btn-login:hover { background: #00b894; color: #1a1d23; }
        .form-control { background: #2a2d35; border: 1px solid #444; color: #e0e0e0; }
        .form-control:focus { background: #2a2d35; border-color: #00D4AA; color: #e0e0e0; box-shadow: 0 0 0 0.2rem rgba(0,212,170,0.25); }
        .alert-warning { background: #3d3520; border-color: #665a20; color: #ffd700; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">Scanner de Red</h2>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-warning">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-login w-100">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
